services:
  # One-shot: generates ./certs (fleet CA + gateway TLS cert) on first
  # startup if it's empty, so a fresh clone works with a single `docker
  # compose up` — no separate manual scripts/gen_dev_tls_cert.sh step to
  # remember (a real source of confusion: app/fleet-gateway crash-looping
  # with a bare FileNotFoundError and no obvious cause until someone
  # realizes the certs were never generated).
  #
  # Deliberately NOT a certificate baked into the image or committed to
  # the repo — every deployment that ever clones this repo would then
  # share the exact same private key, letting anyone who's seen the
  # source code impersonate the gateway or mint fraudulent agent client
  # certs. Generating a fresh one per deployment, at first run, is the
  # only way to get both convenience and a real per-deployment key.
  #
  # gen_dev_tls_cert.sh is already idempotent (reuses an existing CA
  # rather than regenerating it, so it's harmless to re-run on every
  # `docker compose up`) — the explicit file check below just avoids the
  # redundant work and log noise on every ordinary startup. Mounted at
  # /app/certs (not /certs) because the script resolves its own output
  # directory relative to its own location on disk.
  certs-init:
    build:
      context: .
      args:
        MARLINSPIKE_DPI_REPO: ${MARLINSPIKE_DPI_REPO:-https://github.com/eris-ot/marlinspike-dpi.git}
        MARLINSPIKE_DPI_REF: ${MARLINSPIKE_DPI_REF:-326bdbb744a7b8f71295381fd209d9587dc09a3b}
        MARLINSPIKE_MITRE_REPO: ${MARLINSPIKE_MITRE_REPO:-https://github.com/eris-ot/marlinspike-mitre.git}
        MARLINSPIKE_MITRE_REF: ${MARLINSPIKE_MITRE_REF:-c3583ec2d189b8cde69f2160da6a5e8e5b643f7b}
        MARLINSPIKE_MALWARE_REPO: ${MARLINSPIKE_MALWARE_REPO:-https://github.com/eris-ot/marlinspike-malware.git}
        MARLINSPIKE_MALWARE_REF: ${MARLINSPIKE_MALWARE_REF:-4a008211cad7e56609e8a667b95f1c09b790c1b4}
        MARLINSPIKE_MALWARE_RULES_REPO: ${MARLINSPIKE_MALWARE_RULES_REPO:-https://github.com/eris-ot/marlinspike-malware-rules.git}
        MARLINSPIKE_MALWARE_RULES_REF: ${MARLINSPIKE_MALWARE_RULES_REF:-99cbe9358d0a5047d9b5e57a7e4ff5eafdee9bd4}
    container_name: marlinspike-certs-init
    restart: "no"
    # Root only for this one-shot init step, not the long-running app/
    # fleet-gateway containers: on a completely fresh checkout, ./certs
    # doesn't exist yet, so Docker creates the bind-mount target as a
    # root-owned directory before this container even starts — the
    # normal non-root uid (1000) everything else runs as can't write
    # into that. gen_dev_tls_cert.sh's own trailing `chmod 644` on every
    # generated file is what actually makes them readable by the non-root
    # app/fleet-gateway containers afterward, regardless of who owns them.
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if [ -f /app/certs/fleet-ca.crt ] && [ -f /app/certs/gateway.crt ] && [ -f /app/certs/gateway.key ]; then
          echo "certs already present, skipping generation"
        else
          bash /app/scripts/gen_dev_tls_cert.sh marlinspike-fleet-gateway
        fi
    volumes:
      - ./certs:/app/certs
    networks:
      - internal

  app:
    build:
      context: .
      args:
        MARLINSPIKE_DPI_REPO: ${MARLINSPIKE_DPI_REPO:-https://github.com/eris-ot/marlinspike-dpi.git}
        MARLINSPIKE_DPI_REF: ${MARLINSPIKE_DPI_REF:-326bdbb744a7b8f71295381fd209d9587dc09a3b}
        MARLINSPIKE_MITRE_REPO: ${MARLINSPIKE_MITRE_REPO:-https://github.com/eris-ot/marlinspike-mitre.git}
        MARLINSPIKE_MITRE_REF: ${MARLINSPIKE_MITRE_REF:-c3583ec2d189b8cde69f2160da6a5e8e5b643f7b}
        MARLINSPIKE_MALWARE_REPO: ${MARLINSPIKE_MALWARE_REPO:-https://github.com/eris-ot/marlinspike-malware.git}
        MARLINSPIKE_MALWARE_REF: ${MARLINSPIKE_MALWARE_REF:-4a008211cad7e56609e8a667b95f1c09b790c1b4}
        MARLINSPIKE_MALWARE_RULES_REPO: ${MARLINSPIKE_MALWARE_RULES_REPO:-https://github.com/eris-ot/marlinspike-malware-rules.git}
        MARLINSPIKE_MALWARE_RULES_REF: ${MARLINSPIKE_MALWARE_RULES_REF:-99cbe9358d0a5047d9b5e57a7e4ff5eafdee9bd4}
    container_name: marlinspike-app
    restart: unless-stopped
    ports:
      # PORT is also forwarded into the container's environment below —
      # config.py/app.py bind to it, so both sides must move together.
      # Previously hardcoded to 5001:5001 while .env.example documented
      # PORT as configurable, which had zero effect under compose (it
      # only appeared to work because the hardcoded value matched
      # config.py's own default).
      #
      # APP_BIND_HOST defaults to 0.0.0.0 — this deployment needs the web
      # app (and its Fleet page) reachable from other hosts on the LAN
      # (remote sensor agents' operators browsing it, not just this
      # machine), so LAN-wide exposure is the deliberate default here,
      # paired with SESSION_COOKIE_SECURE defaulting to false below (a
      # Secure-flagged cookie is never sent back over plain HTTP to
      # anything but localhost, so the two settings must move together).
      # This app has no TLS termination of its own — only do this on a
      # trusted/private network, since session cookies travel in
      # cleartext. Set APP_BIND_HOST=127.0.0.1 in your own .env to lock
      # it back down to this machine only.
      - "${APP_BIND_HOST:-0.0.0.0}:${PORT:-5001}:${PORT:-5001}"
    environment:
      - DATABASE_URL=postgresql://marlinspike:${DB_PASSWORD}@db:5432/marlinspike
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PORT=${PORT:-5001}
      - HOST=${HOST:-0.0.0.0}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-redis://ratelimit:6379/0}
      - MARLINSPIKE_DPI_BIN=/usr/local/bin/marlinspike-dpi
      - MARLINSPIKE_MALWARE_BIN=/opt/marlinspike-malware/bin/marlinspike-malware
      - MARLINSPIKE_MALWARE_RULES=/usr/share/marlinspike-malware/rules/packs
      - MARLINSPIKE_CISA_ENABLED=${MARLINSPIKE_CISA_ENABLED:-true}
      - MARLINSPIKE_CISA_MODULE=${MARLINSPIKE_CISA_MODULE:-plugins.marlinspike_cisa}
      - LIVE_CAPTURE_ENABLED=${LIVE_CAPTURE_ENABLED:-true}
      - LIVE_CAPTURE_SOCKET=/var/run/marlinspike-capd/marlinspike-capd.sock
      - FLEET_GATEWAY_ADMIN_SOCKET=/var/run/marlinspike-fleet-gateway/admin.sock
      # Public cert only (no key) — lets the Fleet page serve fleet-ca.crt
      # for download (fleet/api.py's /ca-cert route) so an operator
      # enrolling a real remote agent doesn't have to copy the file off
      # this host by hand.
      - FLEET_CA_CERT=${FLEET_CA_CERT:-/certs/fleet-ca.crt}
      # Blank by default — set this to wherever fleet-gateway is actually
      # reachable from a remote agent (see marlinspike/config.py) to get
      # a ready-to-copy enroll command on the Fleet page instead of a
      # placeholder one.
      - FLEET_GATEWAY_PUBLIC_HOST=${FLEET_GATEWAY_PUBLIC_HOST:-}
      - FLEET_GATEWAY_PUBLIC_PORT=${FLEET_GATEWAY_PUBLIC_PORT:-8765}
    depends_on:
      db:
        condition: service_healthy
      ratelimit:
        condition: service_healthy
      # Guarantees certs/fleet-ca.crt actually exists as a real file
      # before this container's own single-file mount of it below ever
      # gets created — without this ordering, Docker would silently
      # create an empty *directory* at that path instead on a completely
      # fresh checkout, breaking cert generation later with a confusing
      # "Is a directory" error.
      certs-init:
        condition: service_completed_successfully
    volumes:
      - marlinspike-data:/app/data
      - capd-socket:/var/run/marlinspike-capd
      - capd-captures:/var/lib/marlinspike/captures:ro
      - fleet-admin-socket:/var/run/marlinspike-fleet-gateway
      # Single-file mount, deliberately not the whole ./certs directory —
      # this container must never have fleet-ca.key (the CA's private
      # signing key) on its filesystem at all, only the public cert it
      # serves for download (fleet/api.py's /ca-cert route). Safe now
      # that certs-init (above) always runs first and guarantees a real
      # file exists at this path.
      - ./certs/fleet-ca.crt:/certs/fleet-ca.crt:ro
    networks:
      - internal
    mem_limit: 3g
    healthcheck:
      # Lets fleet-gateway (below) wait for this container to be up AND
      # past its own startup-time Alembic migration (create_app() runs
      # `flask_migrate.upgrade()` before the server starts listening) —
      # fleet-gateway has no migration logic of its own, so without this
      # a fresh `docker compose --profile fleet up` could have it querying
      # tables that don't exist yet. No dedicated /health route exists, so
      # this just confirms the process is actually serving requests.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PORT:-5001}/login', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Live-capture sidecar (Linux only). Off by default — opt in with:
  #   docker compose --profile capture up -d
  # capd needs CAP_NET_RAW + CAP_NET_ADMIN and must run on the host
  # network namespace so it can see physical NICs. The web app stays
  # unprivileged on the internal bridge and talks to capd over a
  # shared unix socket.
  capd:
    profiles: ["capture"]
    build:
      context: ./marlinspike-capd
    container_name: marlinspike-capd
    restart: unless-stopped
    user: "0:0"   # needs root for CAP_NET_RAW; drops privileges via dumpcap
    cap_add:
      - NET_RAW
      - NET_ADMIN
    network_mode: host
    volumes:
      - capd-socket:/var/run/marlinspike-capd
      - capd-captures:/var/lib/marlinspike/captures
    command:
      - serve
      - --socket=/var/run/marlinspike-capd/marlinspike-capd.sock
      - --capture-root=/var/lib/marlinspike/captures
      # Default matches the app container's uid (1000, set in the
      # Dockerfile) — .env.example documents this explicitly since it's
      # what actually needs to match for the app to connect to capd's
      # socket. The old default of 0 (root) contradicted that documented
      # requirement: a hand-built .env missing this line silently denied
      # the app's connections with no error pointing at the UID mismatch.
      - --allow-uid=${LIVE_CAPTURE_ALLOW_UID:-1000}
    mem_limit: 256m

  # Fleet gateway (Phase 2 of the distributed-agent architecture). Same
  # image as `app` (needs the same models/migrations, nothing else),
  # different command. Starts automatically with the rest of the stack —
  # remote sensor agents enrolling in is a core part of this deployment,
  # not an opt-in extra. Reachable from outside the docker network (remote
  # agents dial in) on its own port (8765) regardless of APP_BIND_HOST
  # above. certs-init (above) generates its TLS cert automatically before
  # this ever starts — nothing to run by hand anymore.
  fleet-gateway:
    build:
      context: .
      args:
        MARLINSPIKE_DPI_REPO: ${MARLINSPIKE_DPI_REPO:-https://github.com/eris-ot/marlinspike-dpi.git}
        MARLINSPIKE_DPI_REF: ${MARLINSPIKE_DPI_REF:-326bdbb744a7b8f71295381fd209d9587dc09a3b}
        MARLINSPIKE_MITRE_REPO: ${MARLINSPIKE_MITRE_REPO:-https://github.com/eris-ot/marlinspike-mitre.git}
        MARLINSPIKE_MITRE_REF: ${MARLINSPIKE_MITRE_REF:-c3583ec2d189b8cde69f2160da6a5e8e5b643f7b}
        MARLINSPIKE_MALWARE_REPO: ${MARLINSPIKE_MALWARE_REPO:-https://github.com/eris-ot/marlinspike-malware.git}
        MARLINSPIKE_MALWARE_REF: ${MARLINSPIKE_MALWARE_REF:-4a008211cad7e56609e8a667b95f1c09b790c1b4}
        MARLINSPIKE_MALWARE_RULES_REPO: ${MARLINSPIKE_MALWARE_RULES_REPO:-https://github.com/eris-ot/marlinspike-malware-rules.git}
        MARLINSPIKE_MALWARE_RULES_REF: ${MARLINSPIKE_MALWARE_RULES_REF:-99cbe9358d0a5047d9b5e57a7e4ff5eafdee9bd4}
    container_name: marlinspike-fleet-gateway
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://marlinspike:${DB_PASSWORD}@db:5432/marlinspike
      - SECRET_KEY=${SECRET_KEY}
      # Phase 5: publishes agent status changes here for the fleet page's
      # live SSE stream (fleet/api.py) — same Redis instance as rate
      # limiting, distinct channel name, no keyspace collision.
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-redis://ratelimit:6379/0}
      # Phase 6: mTLS. Only this container ever reads FLEET_CA_KEY (the app
      # container's own /certs mount is a single read-only file, the
      # public fleet-ca.crt only — never this key) — it's what lets the
      # gateway act as a tiny internal CA, signing each agent's
      # enrollment-time CSR (marlinspike/fleet/gateway/db.py:_sign_csr).
      # certs-init (above) guarantees these files exist before this
      # container ever starts.
      - FLEET_CA_CERT=${FLEET_CA_CERT:-/certs/fleet-ca.crt}
      - FLEET_CA_KEY=${FLEET_CA_KEY:-/certs/fleet-ca.key}
    ports:
      - "0.0.0.0:${FLEET_GATEWAY_PORT:-8765}:8765"
    volumes:
      - ./certs:/certs:ro
      - fleet-admin-socket:/var/run/marlinspike-fleet-gateway
      # Phase 4: ingest_report() writes into config.REPORTS_DIR
      # (/app/data/reports) — without this mount that path is just the
      # gateway container's own local, non-shared filesystem, so a report
      # would "ingest" successfully yet be invisible to the app container
      # and never show up in the UI.
      - marlinspike-data:/app/data
    command:
      - python3
      - -m
      - marlinspike.fleet.gateway
      - serve
      - --host=0.0.0.0
      - --port=8765
      - --tls-cert=/certs/gateway.crt
      - --tls-key=/certs/gateway.key
      - --ca-cert=/certs/fleet-ca.crt
      - --admin-socket=/var/run/marlinspike-fleet-gateway/admin.sock
    depends_on:
      db:
        condition: service_healthy
      ratelimit:
        condition: service_healthy
      # This process has no migration logic of its own (see gateway/db.py's
      # get_app()) — it relies entirely on app's create_app() having
      # already brought the schema to head. Without this, a fresh
      # `docker compose up` has no ordering guarantee between the two
      # and can hit "relation does not exist" errors.
      app:
        condition: service_healthy
      # Also transitively guaranteed via app (above), listed explicitly
      # so this dependency doesn't silently break if app's own chain is
      # ever refactored.
      certs-init:
        condition: service_completed_successfully
    networks:
      - internal
    mem_limit: 256m

  db:
    image: postgres:16-alpine
    container_name: marlinspike-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=marlinspike
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=marlinspike
    volumes:
      - marlinspike-pgdata:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marlinspike"]
      interval: 10s
      timeout: 5s
      retries: 5

  ratelimit:
    image: redis:7-alpine
    container_name: marlinspike-ratelimit
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  marlinspike-data:
  marlinspike-pgdata:
  capd-socket:
  capd-captures:
  fleet-admin-socket:

networks:
  internal:
    driver: bridge
